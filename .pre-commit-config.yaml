default_install_hook_types: [pre-commit, pre-merge-commit]
# Generated GUI build output, setuptools egg-info (tracked, regenerated by every build) and byte-exact
# fixtures (see .gitattributes) are never rewritten.
exclude: ^(pivtools_gui/static/|unit-tests/fixtures/pivraw_contract/|unit-tests/fixtures/davis_attr/|[^/]+/[^/]+\.egg-info/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: debug-statements
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      # The linter runs before the formatter because its fixes can need reformatting (ruff docs, integrations).
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
